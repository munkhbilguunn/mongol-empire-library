name: Keep Supabase Alive

# Supabase Free төлөвлөгийн ~7 хоногийн идэвхгүй байдлын тоолуурыг reset хийх
# зориулалттай heartbeat workflow. 3 хоног тутамд books хүснэгтээс
# 1 мөр уншиж, бодит database activity үүсгэнэ.
#
# ТОХИРУУЛАХ АЛХАМУУД:
# 1. GitHub repo -> Settings -> Secrets and variables -> Actions дээр:
#    - SUPABASE_URL      = https://xxxxx.supabase.co
#    - SUPABASE_ANON_KEY = anon public түлхүүр (service_role биш!)
# 2. Энэ файлыг repo-ийн .github/workflows/keep_alive.yml замд хуулаад
#    main branch руу push хийнэ.
# 3. Actions таб -> Keep Supabase Alive -> Run workflow дарж гараар
#    шалгана. АНХААР: хуучин унасан run дээр "Re-run jobs" дарвал
#    GitHub ХУУЧИН файлаар дахин ажиллана — заавал шинээр Run workflow хийнэ.
#
# АНХААРАХ: Хэрэв Supabase project одоо pause болсон байгаа бол эхлээд
# Supabase Dashboard -> Restore project дарж сэргээ. Pause болсон
# project руу ping явуулах нь сэргээхгүй.

on:
  schedule:
    # 3 хоног тутамд, 00:00 UTC — 7 хоногийн цонхны дотор найдвартай
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Actions табаас гараар ажиллуулах товч

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (reset inactivity timer)
        run: |
          echo "Pinging: ${{ secrets.SUPABASE_URL }}/rest/v1/books?select=id&limit=1"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/books?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "Ping failed — see the response body above for the exact reason."
            exit 1
          fi
